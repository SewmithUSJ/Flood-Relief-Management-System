<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
</head>
<body>

    <div class="box" >
        <img src="../image/logo.jpeg" alt="alternatetext">
        <h2> User Registration </h2>

        <label for="name">Name:</label>
        <input id="name" placeholder="Enter Name" type = "text" name = "name" required><br><br>

        <label for="email">Email:</label>
        <input id="email" placeholder="Enter Email" type = "email" name = "email" required><br><br>

        <label for="password">Password:</label>
        <input id="password" placeholder="Enter Password" type = "password" name = "password" required><br><br>

        <label for="NIC">NIC:</label>
        <input id="NIC" placeholder="Enter NIC" type = "text" name = "NIC" required><br><br>

        <button name = "register">Register</button>
    </div>

    
</body>

</html>
