<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
    body {
      background-image: url('../image/background.jpeg');
      background-size: cover;        
      background-position: center;   
      background-repeat: no-repeat;  
    }
    </style>
</head>
<body>
     <div class="container vh-100 d-flex justify-content-center align-items-center ">

        <div class="card shadow-lg border-0 w-50 bg-transparent">

            <div class="card-header text-center">  
                <img src="../image/logo.jpeg" alt="alternatetext" class="w-75">
            </div>

            <div class="card-body pl-15 text-primary-subtle text-center fs-4">   
                        
                <p class="fs-3 fw-bold"> Login </p>

                <input class="bg-transparent text-dark border-dark rounded" type = "email" name = "email" id="email" placeholder="Enter Email" required><br><br>
                <input class="bg-transparent text-dark border-dark rounded" type = "password" name = "password" id="password" placeholder="Enter Password " required><br><br>

                <button  name = "login" class=" btn bg-dark fs-4 text-light">Login</button>
                    
            </div>
                    
        </div>
    </div>
</body>

</html>
